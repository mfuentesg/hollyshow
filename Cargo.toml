[workspace]
resolver = "2"
members = [
  "crates/core",
  "crates/storage",
  "crates/songs",
  "crates/bible",
  "crates/server",
  "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "UNLICENSED"
repository = "https://github.com/hollyshow/hollyshow"
authors = ["HollyShow contributors"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
ts-rs = { version = "12", features = ["serde-compat"] }
tokio = { version = "1", features = ["sync", "rt", "macros", "time", "net"] }
axum = { version = "0.8", features = ["ws"] }
tower = "0.5"
rusqlite = { version = "0.40", features = ["bundled"] }
tracing = "0.1"
unicode-normalization = "0.1"

hollyshow-core = { path = "crates/core" }
hollyshow-storage = { path = "crates/storage" }
hollyshow-songs = { path = "crates/songs" }
hollyshow-bible = { path = "crates/bible" }
hollyshow-server = { path = "crates/server" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "allow"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
panic = "abort"

[profile.dev.package."*"]
opt-level = 1

[package]
name = "hollyshow-server"
description = "Embedded LAN server: HTTP (remote app, OBS outputs) + WebSocket protocol, pairing, mDNS"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
build = "build.rs"

[lints]
workspace = true

[dependencies]
hollyshow-core.workspace = true
hollyshow-app.workspace = true
axum.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
log.workspace = true
hollyshow-storage-api.workspace = true
rust-embed.workspace = true
mime_guess.workspace = true
mdns-sd = "0.21.5"
if-addrs = "0.15.0"
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
sha2 = "0.11.0"
getrandom = "0.4.3"
futures-util = "0.3.34"
hyper = { version = "1", default-features = false, features = ["http1", "server"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio", "server"] }
tower.workspace = true
time = "0.3"
rcgen = { version = "0.14", default-features = false, features = ["crypto", "aws_lc_rs", "pem"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs", "tls12"] }

[dev-dependencies]
hollyshow-engine.workspace = true
hollyshow-songs.workspace = true
hollyshow-storage-api = { workspace = true, features = ["testing"] }
tokio = { workspace = true, features = ["rt-multi-thread"] }
http-body-util = "0.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json"] }
tempfile = "3"
tokio-tungstenite = "0.30.0"
futures-util = "0.3.34"

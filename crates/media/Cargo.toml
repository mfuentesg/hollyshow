[package]
name = "hollyshow-media"
description = "Open image bank: Openverse and Wikimedia Commons search, license filtering, local media library with attribution"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
unicode-normalization.workspace = true
tokio = { workspace = true, features = ["time", "sync", "rt", "macros", "net"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
image = { version = "0.25.9", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
url = "2.5.8"

[dev-dependencies]
tempfile = "3.27.0"
tokio = { workspace = true, features = ["test-util", "macros", "rt", "io-util"] }

# ts-rs writes bindings here whenever `cargo test` runs. It is deliberately NOT the committed
# directory: plain `cargo test` must never touch tracked files. `pnpm gen:types` overrides this
# variable (it is not `force`d), generates into a temp dir and swaps it into
# packages/protocol/src/generated atomically.
[env]
TS_RS_EXPORT_DIR = { value = "target/ts-bindings", relative = true }

[package]
name = "hollyshow-desktop"
description = "HollyShow desktop shell (Tauri 2): windows, IPC commands and engine wiring"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
default-run = "hollyshow-desktop"

[lib]
name = "hollyshow_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[lints]
workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
hollyshow-core.workspace = true
hollyshow-app.workspace = true
hollyshow-engine.workspace = true
hollyshow-songs.workspace = true
hollyshow-server.workspace = true
hollyshow-bible.workspace = true
hollyshow-media.workspace = true
hollyshow-storage-api.workspace = true
hollyshow-storage-sqlite.workspace = true
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-single-instance = "2"
tauri-plugin-log = "2"
log.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
base64 = "0.22"
flate2 = "1"
sysinfo = { version = "0.37", default-features = false, features = ["system"] }
keepawake = "0.6"

[dev-dependencies]
hollyshow-storage-api = { workspace = true, features = ["testing"] }
tempfile = "3"

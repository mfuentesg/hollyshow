name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Fail fast, before any installer is built, on a tag that does not match the project version
  # (e.g. v0.2.0 would otherwise publish 0.1.0 installers) or on a prerelease WiX rejects.
  version:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tag matches the version files
        run: node scripts/check-version.mjs ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}

  # Quality gate: the same lint, type, test and generated-types checks as CI.
  verify:
    needs: version
    uses: ./.github/workflows/ci.yml

  build:
    needs: [version, verify]
    # Legs all upload into the same draft release (and merge latest.json): run them one at a
    # time so concurrent read-modify-write cycles cannot drop a platform.
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target universal-apple-darwin"
          - platform: windows-latest
            args: ""
          - platform: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev libsoup-3.0-dev patchelf

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          # Universal macOS binary needs both architectures.
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          # One cache per matrix leg: targets and profiles differ and must not evict each other.
          key: release-${{ matrix.platform }}

      - run: pnpm install --frozen-lockfile

      # The remote web app is built first; the Rust server embeds its dist/ (build.rs refuses a
      # release build without it).
      - run: pnpm --filter remote build

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updater signature (required by tauri.release.conf.json). Never commit the key.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # ---- OS code signing: unsigned until these repository secrets exist (docs/RELEASE.md). ----
          # macOS (Developer ID + notarization):
          # APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          # APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}   # app-specific password
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Windows (Azure Trusted Signing via bundle.windows.signCommand, or an OV/EV certificate):
          # AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          # AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          # AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        with:
          projectPath: apps/desktop
          # pnpm-lock.yaml lives at the repo root, so auto-detection in projectPath would fall back
          # to npm. Be explicit.
          tauriScript: pnpm tauri
          # A tag push uses the tag; a manual run uses the version from the project files.
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v__VERSION__' }}
          releaseName: "HollyShow v__VERSION__"
          releaseBody: "Consulta docs/USER_GUIDE.md para instalar. Los instaladores pueden estar sin firmar (ver docs/RELEASE.md)."
          # Draft until every leg succeeded: the `publish` job validates latest.json and then
          # publishes, so a failed leg never leaves a live release the updater would pick up.
          releaseDraft: true
          # Prerelease flag from real tags only (a branch name with a hyphen must not count).
          prerelease: ${{ startsWith(github.ref, 'refs/tags/') && contains(github.ref_name, '-') }}
          # Without the signing secret (e.g. a first test run) build plain installers: no updater
          # artifacts, and the publish job leaves the release as a draft.
          includeUpdaterJson: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
          updaterJsonPreferNsis: true
          # The overlay turns on signed updater artifacts (needs TAURI_SIGNING_PRIVATE_KEY); local
          # `pnpm tauri build` works without the key. The path is relative to projectPath
          # (apps/desktop), where `pnpm tauri` runs.
          args: ${{ matrix.args }} ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' && '--config src-tauri/tauri.release.conf.json' || '' }}

      # Also on failure, so a broken leg still leaves whatever it bundled for inspection.
      - name: Upload bundles as workflow artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hollyshow-${{ matrix.platform }}
          if-no-files-found: warn
          path: |
            target/**/release/bundle/**/*.dmg
            target/**/release/bundle/**/*.app.tar.gz
            target/**/release/bundle/**/*.exe
            target/**/release/bundle/**/*.msi
            target/**/release/bundle/**/*.deb
            target/**/release/bundle/**/*.AppImage
            target/**/release/bundle/**/*.sig

  # Runs only when every leg succeeded: checks the merged latest.json, then publishes the draft.
  publish:
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      HAS_UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate latest.json and publish the release
        run: |
          if [ "${HAS_UPDATER_KEY}" != "true" ]; then
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY is not set: installers were built without updater artifacts; the release stays a draft (see docs/SIGNING.md)."
            exit 0
          fi
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="v$(node -p "require('./package.json').version")"
          fi
          mkdir -p "$RUNNER_TEMP/rel"
          gh release download "$TAG" --pattern latest.json --dir "$RUNNER_TEMP/rel" --clobber
          node -e '
            const j = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"));
            const keys = Object.keys(j.platforms || {});
            console.log("platforms:", keys.join(", "));
            for (const os of ["darwin", "windows", "linux"]) {
              const k = keys.filter((x) => x.startsWith(os + "-"));
              if (!k.length || k.some((x) => !j.platforms[x].url || !j.platforms[x].signature)) {
                console.error("latest.json is missing a complete " + os + " entry");
                process.exit(1);
              }
            }
          ' "$RUNNER_TEMP/rel/latest.json"
          gh release edit "$TAG" --draft=false

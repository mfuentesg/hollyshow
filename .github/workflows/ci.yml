name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Reused by release.yml as its quality gate: releases run exactly these steps.
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  check:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev libsoup-3.0-dev patchelf build-essential curl wget file

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: ci

      - run: pnpm install --frozen-lockfile

      - name: Version files are consistent
        run: node scripts/check-version.mjs ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}

      # The Tauri and server crates embed the built frontends at compile time (they fall back to a
      # placeholder on a fresh clone, but CI tests the real thing).
      # Catches a wrong release overlay path (relative to apps/desktop) on every PR, not at release.
      - name: Release config overlay resolves
        run: |
          test -f apps/desktop/src-tauri/tauri.release.conf.json
          node -e 'JSON.parse(require("fs").readFileSync("apps/desktop/src-tauri/tauri.release.conf.json","utf8"))'
          cd apps/desktop && pnpm tauri build --config src-tauri/tauri.release.conf.json --help >/dev/null

      - name: Build frontends
        run: pnpm build:web

      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo test
        run: cargo test --workspace

      # `git diff` ignores untracked files, so a new type nobody committed would pass. Porcelain
      # status reports modified, deleted AND untracked files under the generated directory.
      - name: Generated TS types are up to date
        run: |
          pnpm gen:types
          if [ -n "$(git status --porcelain -- packages/protocol/src/generated)" ]; then
            git status --short -- packages/protocol/src/generated
            echo "::error::Generated types are stale. Run 'pnpm gen:types' and commit the result."
            exit 1
          fi

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
